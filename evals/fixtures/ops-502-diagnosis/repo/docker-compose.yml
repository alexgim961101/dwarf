services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1::80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  api:
    image: node:22.17.0-alpine
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./api:/app:ro
    env_file:
      - .env
