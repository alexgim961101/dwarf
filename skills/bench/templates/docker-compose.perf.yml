# bench 측정 환경 골격. <작업 디렉토리>/.docs/perf/compose.yml 로 복사해 app 서비스를 채운다.
# 비교하는 코드(기준선·사후 등)끼리는 app 의 코드만 다르다. 설정·환경변수·데이터셋은 같게 둔다.
services:
  app:
    build:
      context: ../..            # 프로젝트 루트
    environment: []             # 운영과 같은 값. 기본값으로 두지 않는다
    volumes:
      - ./data:/data:ro         # 고정 데이터셋
    # ports, depends_on 은 프로젝트에 맞게
    # 프로파일이 필요하면 별도 run 에서만 켠다 (예: GODEBUG, NODE_OPTIONS=--cpu-prof)

  k6:
    image: grafana/k6:latest
    profiles: ["service"]       # 서비스 모드에서만
    volumes:
      - ./k6.js:/scripts/k6.js:ro
      - ./out:/out
    depends_on:
      - app
    entrypoint: ["k6"]
